<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f9d55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="四択">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>4択回答シート</title>
<style>
:root{
  --bg:#f6f7fb;--card:#fff;--panel:#f0f2f6;--text:#202124;--muted:#70757a;
  --border:#d9dce3;--accent:#5865f2;--accentbg:#eef0ff;
  --green:#1f9d55;--greenbg:#eaf8ef;--red:#d93025;--redbg:#fdeceb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit} button{cursor:pointer;touch-action:manipulation}
.app{width:min(100%,720px);margin:auto;padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
.stack{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}
.compact{padding:10px 12px;border-radius:12px}
.label{font-size:12px;font-weight:700;margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center}
input{min-width:0;flex:1;height:40px;border:1px solid var(--border);border-radius:10px;background:#fff;padding:8px 11px;font-size:16px}
.btn{min-height:44px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--text);padding:8px 12px;font-weight:700}
.btn.primary{border-color:var(--accent);background:var(--accentbg)}
.helper,.muted{font-size:12px;color:var(--muted)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.current-field{font-size:14px;color:var(--muted)} .current-field strong{color:var(--text)}
.qnum{font-size:30px;font-weight:800;margin-top:2px}
.answered{font-size:14px;color:var(--muted);text-align:right}
.section-title{font-size:14px;font-weight:800;margin-bottom:8px}
.mode-grid,.mark-grid,.nav-grid,.grade-grid{display:grid;gap:8px}
.mode-grid{grid-template-columns:repeat(3,1fr)}
.mark-grid{grid-template-columns:repeat(4,1fr)}
.nav-grid{grid-template-columns:1fr 1fr}
.mode{min-height:48px;border:1px solid var(--border);border-radius:12px;background:#fff;font-size:14px;font-weight:700}
.mode.active{background:var(--accentbg);border-color:var(--accent)}
.mode-hint{font-size:14px;color:var(--muted);margin-top:8px}
.judge{background:var(--panel)}
.judge-title{text-align:center;font-weight:800}
.judge-help{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 12px}
.mark-btn{min-height:78px;border:1px solid var(--border);border-radius:16px;background:#fff}
.mark-btn .n{font-size:21px;font-weight:800}.mark-btn .m{font-size:22px;font-weight:800;color:var(--muted);margin-top:3px}
.mark-btn.o{background:var(--greenbg);border-color:var(--green)} .mark-btn.o .m{color:var(--green)}
.mark-btn.x{background:var(--redbg);border-color:var(--red)} .mark-btn.x .m{color:var(--red)}
.derived{margin-top:12px;border:1px solid var(--border);border-radius:12px;background:#fff;padding:10px;text-align:center;font-weight:700;font-size:14px}
.full{width:100%}
.hidden{display:none!important}
.score-title{font-weight:800}.overall{font-size:18px;font-weight:800;margin-top:10px}.wrong{font-size:14px;color:var(--muted);margin-top:7px}
.divider{border-top:1px solid var(--border);margin-top:14px;padding-top:12px}
.field-scores,.answers{display:grid;gap:8px;margin-top:8px}
.field-row{display:flex;justify-content:space-between;gap:10px;background:var(--panel);border-radius:10px;padding:9px 10px}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.field-group{display:grid;gap:7px}.field-name{font-size:14px;font-weight:800}
.answer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.answer-grid.score{grid-template-columns:repeat(2,1fr)}
.answer-mini,.score-card{border:1px solid var(--border);border-radius:11px;background:#fff}
.answer-mini{min-height:54px;padding:5px;text-align:center}
.answer-mini .small,.score-card .small{font-size:11px;color:var(--muted)}
.answer-mini .marks{font-size:12px;font-weight:700}.answer-mini .val{font-size:12px}
.score-card{padding:8px}.score-top{width:100%;border:0;background:transparent;text-align:left;padding:0}
.grade-grid{grid-template-columns:1fr 1fr;margin-top:8px}
.grade{min-height:42px;border:1px solid var(--border);border-radius:9px;background:#fff;font-weight:800}
.grade.ok.active{background:var(--greenbg);border-color:var(--green)}
.grade.ng.active{background:var(--redbg);border-color:var(--red)}
@media(max-width:430px){.app{padding:calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}.mode{font-size:13px}.qnum{font-size:28px}}
</style>
</head>
<body>
<main class="app">
<div class="stack">

<section class="card compact">
  <div class="label">分野名</div>
  <div class="row">
    <input id="fieldInput" type="text" autocomplete="off" placeholder="例：民法・意思表示">
    <button id="setField" class="btn primary" type="button">設定</button>
  </div>
  <div class="helper" style="margin-top:5px">未入力なら前の分野を引き継ぎます</div>
</section>

<section class="card">
  <div class="qhead">
    <div>
      <div class="current-field">現在の分野：<strong id="fieldLabel">未設定</strong></div>
      <div class="qnum"><span id="qNum">1</span>問目</div>
    </div>
    <div class="answered">回答済み <strong id="answeredCount">0</strong>問</div>
  </div>
</section>

<section>
  <div class="section-title">問題タイプ</div>
  <div class="mode-grid">
    <button class="mode active" data-mode="correct" type="button">正しいもの</button>
    <button class="mode" data-mode="wrong" type="button">誤っているもの</button>
    <button class="mode" data-mode="count" type="button">正しい数</button>
  </div>
  <div id="modeHint" class="mode-hint"></div>
</section>

<section class="card judge">
  <div class="judge-title">各選択肢を判定</div>
  <div class="judge-help">未判定 → ○ → × の順に切り替わります</div>

  <div class="mark-grid">
    <button class="mark-btn" data-i="0" type="button"><div class="n">①</div><div class="m">－</div></button>
    <button class="mark-btn" data-i="1" type="button"><div class="n">②</div><div class="m">－</div></button>
    <button class="mark-btn" data-i="2" type="button"><div class="n">③</div><div class="m">－</div></button>
    <button class="mark-btn" data-i="3" type="button"><div class="n">④</div><div class="m">－</div></button>
  </div>

  <div id="derived" class="derived">まだ答えは確定していません</div>
  <button id="confirm" class="btn primary full" style="margin-top:12px" type="button">この問題を確定して次へ</button>
</section>

<section class="nav-grid">
  <button id="prev" class="btn" type="button">← 前へ</button>
  <button id="next" class="btn" type="button">次へ →</button>
</section>

<button id="scoreToggle" class="btn full" type="button">採点モードにする</button>

<section id="scorePanel" class="card hidden">
  <div class="score-title">採点結果</div>
  <div id="overall" class="overall">まだ採点されていません</div>
  <div id="wrong" class="wrong"></div>
  <div class="divider">
    <div class="section-title">分野別</div>
    <div id="fieldScores" class="field-scores"></div>
  </div>
</section>

<section class="card">
  <div class="list-head">
    <div>
      <div class="section-title" style="margin:0">回答一覧</div>
      <div id="listHint" class="muted">タップするとその問題に戻れます</div>
    </div>
    <button id="reset" class="btn" type="button">リセット</button>
  </div>
  <div id="answerList" class="answers"></div>
  <div id="empty" class="muted" style="margin-top:10px">まだ回答はありません。</div>
</section>

</div>
</main>

<script>
(() => {
  const STORAGE_KEY = "four_choice_sheet_v2";

  let state = {
    current: 1,
    currentMode: "correct",
    currentField: "未設定",
    marks: [null,null,null,null],
    scoreMode: false,
    answers: {},
    grades: {}
  };

  const $ = id => document.getElementById(id);
  const modes = {
    correct: "各肢を○×で判定。○が1つになれば、その番号が回答です。",
    wrong: "各肢を○×で判定。×が1つになれば、その番号が回答です。",
    count: "各肢を○×で判定。○の個数がそのまま回答になります。"
  };

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      if (!s || typeof s !== "object") return;
      state = {
        current: Number.isInteger(s.current) && s.current > 0 ? s.current : 1,
        currentMode: ["correct","wrong","count"].includes(s.currentMode) ? s.currentMode : "correct",
        currentField: typeof s.currentField === "string" && s.currentField ? s.currentField : "未設定",
        marks: Array.isArray(s.marks) && s.marks.length === 4 ? s.marks : [null,null,null,null],
        scoreMode: !!s.scoreMode,
        answers: s.answers && typeof s.answers === "object" ? s.answers : {},
        grades: s.grades && typeof s.grades === "object" ? s.grades : {}
      };
    } catch(e) {}
  }

  function answerKeys() {
    return Object.keys(state.answers).map(Number).filter(Number.isFinite).sort((a,b)=>a-b);
  }

  function derive() {
    const circles = [];
    const crosses = [];
    state.marks.forEach((v,i)=>{ if(v==="o") circles.push(i+1); if(v==="x") crosses.push(i+1); });

    if (state.currentMode === "correct") {
      return circles.length === 1
        ? {valid:true,value:circles[0],text:"回答："+["","①","②","③","④"][circles[0]]}
        : {valid:false,text:"○を1つにすると回答が確定します"};
    }
    if (state.currentMode === "wrong") {
      return crosses.length === 1
        ? {valid:true,value:crosses[0],text:"回答："+["","①","②","③","④"][crosses[0]]}
        : {valid:false,text:"×を1つにすると回答が確定します"};
    }
    const judged = state.marks.filter(Boolean).length;
    return judged === 4
      ? {valid:true,value:circles.length,text:"回答：正しいものは "+circles.length+" 個"}
      : {valid:false,text:"4つすべて○×を付けると回答が確定します"};
  }

  function renderMarks() {
    document.querySelectorAll(".mark-btn").forEach(btn=>{
      const i = Number(btn.dataset.i);
      const v = state.marks[i];
      btn.classList.remove("o","x");
      btn.querySelector(".m").textContent = "－";
      if (v === "o") { btn.classList.add("o"); btn.querySelector(".m").textContent = "○"; }
      if (v === "x") { btn.classList.add("x"); btn.querySelector(".m").textContent = "×"; }
    });
    const d = derive();
    $("derived").textContent = d.text;
    $("derived").style.borderColor = d.valid ? "var(--accent)" : "var(--border)";
  }

  function renderModes() {
    document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active", b.dataset.mode===state.currentMode));
    $("modeHint").textContent = modes[state.currentMode];
  }

  function renderScore() {
    const keys = answerKeys().filter(n => Object.prototype.hasOwnProperty.call(state.grades, n));
    if (!keys.length) {
      $("overall").textContent = "まだ採点されていません";
      $("wrong").textContent = "回答一覧で各問題を○・×で採点してください。";
      $("fieldScores").innerHTML = "";
      return;
    }

    const correct = keys.filter(n=>state.grades[n]===true);
    const wrong = keys.filter(n=>state.grades[n]===false);
    const rate = Math.round(correct.length / keys.length * 100);
    $("overall").textContent = `${keys.length}問中 ${correct.length}問正解 / 正答率${rate}%`;
    $("wrong").textContent = wrong.length ? `間違い：${wrong.join("、")}問` : "間違い：なし 🎉";

    const stats = {};
    keys.forEach(n=>{
      const f = state.answers[n].field || "未設定";
      if (!stats[f]) stats[f] = {correct:0,total:0};
      stats[f].total++;
      if (state.grades[n]===true) stats[f].correct++;
    });

    $("fieldScores").innerHTML = "";
    Object.entries(stats).forEach(([field,s])=>{
      const row = document.createElement("div");
      row.className = "field-row";
      const l = document.createElement("div");
      l.style.fontWeight = "700";
      l.textContent = field;
      const r = document.createElement("div");
      r.style.fontWeight = "800";
      r.textContent = `${s.correct}/${s.total}　${Math.round(s.correct/s.total*100)}%`;
      row.append(l,r);
      $("fieldScores").appendChild(row);
    });
  }

  function renderAnswers() {
    $("answerList").innerHTML = "";
    const keys = answerKeys();
    $("empty").classList.toggle("hidden", keys.length>0);

    let lastField = null, group = null, grid = null;
    keys.forEach(n=>{
      const item = state.answers[n];
      if (item.field !== lastField) {
        group = document.createElement("div");
        group.className = "field-group";
        const h = document.createElement("div");
        h.className = "field-name";
        h.textContent = item.field || "未設定";
        group.appendChild(h);
        grid = document.createElement("div");
        grid.className = state.scoreMode ? "answer-grid score" : "answer-grid";
        group.appendChild(grid);
        $("answerList").appendChild(group);
        lastField = item.field;
      }

      const marks = item.marks.map(v=>v==="o"?"○":v==="x"?"×":"－").join("");
      const value = item.mode==="count" ? item.answer+"個" : ["","①","②","③","④"][item.answer];

      if (!state.scoreMode) {
        const b = document.createElement("button");
        b.className = "answer-mini";
        b.type = "button";
        b.innerHTML = `<div class="small">${n}</div><div class="marks">${marks}</div><div class="val">${value}</div>`;
        b.addEventListener("click",()=>loadQuestion(n));
        grid.appendChild(b);
      } else {
        const card = document.createElement("div");
        card.className = "score-card";
        const top = document.createElement("button");
        top.type = "button";
        top.className = "score-top";
        top.innerHTML = `<div class="small">${n}問目</div><div style="font-size:14px;font-weight:700;margin-top:3px">${marks} → ${value}</div>`;
        top.addEventListener("click",()=>loadQuestion(n));
        card.appendChild(top);

        const gg = document.createElement("div");
        gg.className = "grade-grid";

        const ok = document.createElement("button");
        ok.className = "grade ok" + (state.grades[n]===true ? " active":"");
        ok.type = "button"; ok.textContent = "○ 正解";
        ok.addEventListener("click",()=>{state.grades[n]=true; save(); renderAnswers(); renderScore();});

        const ng = document.createElement("button");
        ng.className = "grade ng" + (state.grades[n]===false ? " active":"");
        ng.type = "button"; ng.textContent = "× 不正解";
        ng.addEventListener("click",()=>{state.grades[n]=false; save(); renderAnswers(); renderScore();});

        gg.append(ok,ng); card.appendChild(gg); grid.appendChild(card);
      }
    });
  }

  function render() {
    $("qNum").textContent = state.current;
    $("answeredCount").textContent = answerKeys().length;
    $("fieldLabel").textContent = state.currentField;
    $("scoreToggle").textContent = state.scoreMode ? "回答モードに戻る" : "採点モードにする";
    $("scoreToggle").classList.toggle("primary", state.scoreMode);
    $("scorePanel").classList.toggle("hidden", !state.scoreMode);
    $("listHint").textContent = state.scoreMode ? "問題集の解答を見ながら、○正解 / ×不正解をタップ" : "タップするとその問題に戻れます";
    renderModes(); renderMarks(); renderAnswers();
    if (state.scoreMode) renderScore();
  }

  function loadQuestion(n) {
    state.current = Math.max(1,n);
    const item = state.answers[state.current];
    if (item) {
      state.currentMode = item.mode;
      state.currentField = item.field;
      state.marks = [...item.marks];
    } else {
      state.marks = [null,null,null,null];
    }
    save(); render();
  }

  $("setField").addEventListener("click",()=>{
    const v = $("fieldInput").value.trim();
    if (v) state.currentField = v;
    $("fieldInput").value = "";
    save(); render();
  });

  $("fieldInput").addEventListener("keydown",e=>{
    if (e.key==="Enter") { e.preventDefault(); $("setField").click(); }
  });

  document.querySelectorAll(".mode").forEach(btn=>btn.addEventListener("click",()=>{
    state.currentMode = btn.dataset.mode; save(); render();
  }));

  document.querySelectorAll(".mark-btn").forEach(btn=>btn.addEventListener("click",()=>{
    const i = Number(btn.dataset.i);
    state.marks[i] = state.marks[i]===null ? "o" : state.marks[i]==="o" ? "x" : null;
    save(); renderMarks();
  }));

  $("confirm").addEventListener("click",()=>{
    const d = derive();
    if (!d.valid) { $("derived").textContent = d.text; return; }
    state.answers[state.current] = {
      field: state.currentField,
      mode: state.currentMode,
      marks: [...state.marks],
      answer: d.value
    };
    state.current++;
    state.marks = [null,null,null,null];
    save(); render();
  });

  $("prev").addEventListener("click",()=>loadQuestion(state.current-1));
  $("next").addEventListener("click",()=>loadQuestion(state.current+1));

  $("scoreToggle").addEventListener("click",()=>{
    state.scoreMode = !state.scoreMode; save(); render();
  });

  $("reset").addEventListener("click",()=>{
    if (!confirm("回答と採点結果をすべてリセットしますか？")) return;
    state = {
      current:1,currentMode:"correct",currentField:state.currentField,
      marks:[null,null,null,null],scoreMode:false,answers:{},grades:{}
    };
    save(); render();
  });

  load();
  render();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
