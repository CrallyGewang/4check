<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f9d55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="四択">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>4択回答シート</title>
<style>
:root{
  --bg:#f6f7fb;--card:#fff;--panel:#f0f2f6;--text:#202124;--muted:#70757a;
  --border:#d9dce3;--accent:#5865f2;--accentbg:#eef0ff;
  --green:#1f9d55;--greenbg:#eaf8ef;--red:#d93025;--redbg:#fdeceb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit} button{cursor:pointer;touch-action:manipulation}
.app{width:min(100%,720px);margin:auto;padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
.stack{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}
.compact{padding:10px 12px;border-radius:12px}
.label{font-size:12px;font-weight:700;margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center}
.session-mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.session-mode{min-height:54px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--text);font-weight:800;padding:8px}.session-mode.active{background:var(--accentbg);border-color:var(--accent)}.session-mode .sub{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}.workbook-grade-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.workbook-grade{min-height:52px;border-radius:12px;font-weight:800;border:1px solid var(--border);background:#fff}.workbook-grade.ok{background:var(--greenbg);border-color:var(--green);color:#157340}.workbook-grade.ng{background:var(--redbg);border-color:var(--red);color:#a61f17}
input{min-width:0;flex:1;height:40px;border:1px solid var(--border);border-radius:10px;background:#fff;padding:8px 11px;font-size:16px}
.btn{min-height:44px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--text);padding:8px 12px;font-weight:700}
.btn.primary{border-color:var(--accent);background:var(--accentbg)}
.helper,.muted{font-size:12px;color:var(--muted)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.current-field{font-size:14px;color:var(--muted)} .current-field strong{color:var(--text)}
.qnum{font-size:30px;font-weight:800;margin-top:2px;color:#2664c7}
.answered{font-size:14px;color:var(--muted);text-align:right}
.section-title{font-size:14px;font-weight:800;margin-bottom:8px}
.mode-grid,.mark-grid,.nav-grid,.grade-grid{display:grid;gap:8px}
.mode-grid{grid-template-columns:repeat(3,1fr)}
.mark-grid{grid-template-columns:repeat(4,1fr)}
.nav-grid{grid-template-columns:1fr 1fr}
.mode{min-height:48px;border:1px solid var(--border);border-radius:12px;background:#fff;font-size:14px;font-weight:700}
.mode.active{background:var(--accentbg);border-color:var(--accent)}
.mode-hint{font-size:14px;color:var(--muted);margin-top:8px}
.judge{background:var(--panel)}
.judge-title{text-align:center;font-weight:800}
.judge-help{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 12px}
.mark-btn{min-height:78px;border:1px solid var(--border);border-radius:16px;background:#fff}
.mark-btn .n{font-size:21px;font-weight:800}.mark-btn .m{font-size:22px;font-weight:800;color:var(--muted);margin-top:3px}
.mark-btn.o{background:var(--greenbg);border-color:var(--green)} .mark-btn.o .m{color:var(--green)}
.mark-btn.x{background:var(--redbg);border-color:var(--red)} .mark-btn.x .m{color:var(--red)}
.derived{margin-top:12px;border:1px solid var(--border);border-radius:12px;background:#fff;padding:10px;text-align:center;font-weight:700;font-size:14px}
.full{width:100%}
.hidden{display:none!important}
.score-title{font-weight:800}.overall{font-size:18px;font-weight:800;margin-top:10px}.wrong{font-size:14px;color:var(--muted);margin-top:7px}
.divider{border-top:1px solid var(--border);margin-top:14px;padding-top:12px}
.field-scores,.answers{display:grid;gap:8px;margin-top:8px}
.field-row{display:flex;justify-content:space-between;gap:10px;background:var(--panel);border-radius:10px;padding:9px 10px}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.field-group{display:grid;gap:7px}.field-name{font-size:14px;font-weight:800}
.answer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.answer-grid.score{grid-template-columns:repeat(2,1fr)}
.answer-mini,.score-card{border:1px solid var(--border);border-radius:11px;background:#fff}
.answer-mini{min-height:54px;padding:5px;text-align:center}.answer-mini.correct{background:var(--greenbg);border-color:var(--green)}.answer-mini.incorrect{background:var(--redbg);border-color:var(--red)}
.answer-mini .small,.score-card .small{font-size:11px;color:var(--muted)}
.answer-mini .marks{font-size:12px;font-weight:700}.answer-mini .val{font-size:12px}
.score-card{padding:8px}.score-top{width:100%;border:0;background:transparent;text-align:left;padding:0}
.grade-grid{grid-template-columns:1fr 1fr;margin-top:8px}
.grade{min-height:42px;border:1px solid var(--border);border-radius:9px;background:#fff;font-weight:800}
.grade.ok.active{background:var(--greenbg);border-color:var(--green)}
.grade.ng.active{background:var(--redbg);border-color:var(--red)}
.share-box{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 10px;background:var(--panel);border-radius:10px;padding:10px;font-size:12px;line-height:1.55;color:var(--text);max-height:230px;overflow:auto}.copy-status{min-height:18px;margin-top:6px;text-align:center}.btn:disabled{opacity:.45;cursor:default}
@media(max-width:430px){.app{padding:calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}.mode{font-size:13px}.qnum{font-size:28px}}
</style>
</head>
<body>
<main class="app">
<div class="stack">

<section class="card compact">
  <div class="label">学習形式</div>
  <div class="session-mode-grid">
    <button class="session-mode" data-session="workbook" type="button">問題集<span class="sub">1問ごとに正否を記録</span></button>
    <button class="session-mode" data-session="exam" type="button">過去問・模試<span class="sub">最後にまとめて答え合わせ</span></button>
  </div>
  <div id="sessionModeHint" class="helper" style="margin-top:7px"></div>
</section>

<section class="card compact">
  <div class="label">分野名</div>
  <div class="row">
    <input id="fieldInput" type="text" autocomplete="off" placeholder="例：宅建業法26">
    <button id="setField" class="btn primary" type="button">設定</button>
  </div>
  <div class="helper" style="margin-top:5px">例：宅建業法26 → 分野「宅建業法」・26問目。次は27問目になります</div>
</section>

<section class="card">
  <div class="qhead">
    <div>
      <div class="current-field">現在の分野：<strong id="fieldLabel">未設定</strong></div>
      <div class="qnum"><span id="qNum">1</span>問目</div>
    </div>
    <div class="answered">回答済み <strong id="answeredCount">0</strong>問</div>
  </div>
</section>

<section>
  <div class="section-title">問題タイプ</div>
  <div class="mode-grid">
    <button class="mode active" data-mode="correct" type="button">正しいもの</button>
    <button class="mode" data-mode="wrong" type="button">誤っているもの</button>
    <button class="mode" data-mode="count" type="button">正しい数</button>
  </div>
  <div id="modeHint" class="mode-hint"></div>
</section>

<section class="card judge">
  <div class="judge-title">各選択肢を判定</div>
  <div class="judge-help">未判定 → ○ → × の順に切り替わります</div>

  <div class="mark-grid">
    <button class="mark-btn" data-i="0" type="button"><div class="n">①</div><div class="m">－</div></button>
    <button class="mark-btn" data-i="1" type="button"><div class="n">②</div><div class="m">－</div></button>
    <button class="mark-btn" data-i="2" type="button"><div class="n">③</div><div class="m">－</div></button>
    <button class="mark-btn" data-i="3" type="button"><div class="n">④</div><div class="m">－</div></button>
  </div>

  <div id="derived" class="derived">まだ答えは確定していません</div>
  <div id="examConfirmWrap">
    <button id="confirm" class="btn primary full" style="margin-top:12px" type="button">この問題を確定して次へ</button>
  </div>
  <div id="workbookGradeWrap" class="hidden" style="margin-top:12px">
    <div class="helper" style="text-align:center">答え合わせしたら、その場で正否を記録</div>
    <div class="workbook-grade-grid">
      <button id="workbookCorrect" class="workbook-grade ok" type="button">○ 正解して次へ</button>
      <button id="workbookWrong" class="workbook-grade ng" type="button">× 不正解で次へ</button>
    </div>
  </div>
</section>

<section class="nav-grid">
  <button id="prev" class="btn" type="button">← 前へ</button>
  <button id="next" class="btn" type="button">次へ →</button>
</section>

<button id="scoreToggle" class="btn full" type="button">採点モードにする</button>

<section id="scorePanel" class="card hidden">
  <div class="score-title">採点結果</div>
  <div id="overall" class="overall">まだ採点されていません</div>
  <div id="wrong" class="wrong"></div>
  <div class="divider">
    <div class="section-title">分野別</div>
    <div id="fieldScores" class="field-scores"></div>
  </div>
  <div class="divider">
    <div class="section-title">ChatGPTに苦手分野を分析してもらう</div>
    <div class="helper">日付・各問題の開始／確定時刻・採点結果・分野別成績をまとめてコピーします</div>
    <pre id="sharePreview" class="share-box">採点すると、ここに送信用の文章が表示されます。</pre>
    <button id="copyResult" class="btn primary full" type="button" disabled>結果をコピー</button>
    <div id="copyStatus" class="helper copy-status"></div>
  </div>
</section>

<section class="card">
  <div class="list-head">
    <div>
      <div class="section-title" style="margin:0">回答一覧</div>
      <div id="listHint" class="muted">タップするとその問題に戻れます</div>
    </div>
    <button id="reset" class="btn" type="button">リセット</button>
  </div>
  <div id="answerList" class="answers"></div>
  <div id="empty" class="muted" style="margin-top:10px">まだ回答はありません。</div>
</section>

</div>
</main>

<script>
(() => {
  const STORAGE_KEY = "four_choice_sheet_v2";

  function currentDateTimeParts(date = new Date()) {
    const d = date;
    const pad = n => String(n).padStart(2,"0");
    return {
      date: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,
      time: `${pad(d.getHours())}:${pad(d.getMinutes())}`
    };
  }

  let state = {
    sessionType: "workbook",
    current: 1,
    currentPaperNumber: 1,
    currentStartedAt: new Date().toISOString(),
    starts: {},
    currentMode: "correct",
    currentField: "未設定",
    marks: [null,null,null,null],
    scoreMode: false,
    answers: {},
    grades: {}
  };

  const $ = id => document.getElementById(id);
  const sessionHints = {
    workbook: "問題集モード：1問ごとに答え合わせし、○正解 / ×不正解を記録して次へ進みます。",
    exam: "過去問・模試モード：回答だけ先に記録し、最後に採点モードでまとめて答え合わせします。"
  };
  const modes = {
    correct: "各肢を○×で判定。○が1つになれば、その番号が回答です。",
    wrong: "各肢を○×で判定。×が1つになれば、その番号が回答です。",
    count: "ア～エを○×で判定。○を付けた文字の組み合わせが回答になります。"
  };

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      if (!s || typeof s !== "object") return;
      state = {
        sessionType: ["workbook","exam"].includes(s.sessionType) ? s.sessionType : "exam",
        current: Number.isInteger(s.current) && s.current > 0 ? s.current : 1,
        currentPaperNumber: Number.isInteger(s.currentPaperNumber) && s.currentPaperNumber > 0 ? s.currentPaperNumber : (Number.isInteger(s.current) && s.current > 0 ? s.current : 1),
        currentStartedAt: typeof s.currentStartedAt === "string" && !isNaN(Date.parse(s.currentStartedAt)) ? s.currentStartedAt : new Date().toISOString(),
        starts: s.starts && typeof s.starts === "object" ? s.starts : {},
        currentMode: ["correct","wrong","count"].includes(s.currentMode) ? s.currentMode : "correct",
        currentField: typeof s.currentField === "string" && s.currentField ? s.currentField : "未設定",
        legacySessionDate: typeof s.sessionDate === "string" ? s.sessionDate : s.legacySessionDate,
        marks: Array.isArray(s.marks) && s.marks.length === 4 ? s.marks : [null,null,null,null],
        scoreMode: !!s.scoreMode,
        answers: s.answers && typeof s.answers === "object" ? s.answers : {},
        grades: s.grades && typeof s.grades === "object" ? s.grades : {}
      };
    } catch(e) {}
  }

  function answerKeys() {
    return Object.keys(state.answers).map(Number).filter(Number.isFinite).sort((a,b)=>a-b);
  }

  function paperNumber(n) {
    const item = state.answers[n];
    return item && Number.isInteger(item.paperNumber) ? item.paperNumber : n;
  }

  function answerValue(item) {
    if (item.mode !== "count") return ["","①","②","③","④"][item.answer] || "－";
    if (typeof item.answer === "number" && Array.isArray(item.marks)) {
      return item.marks.map((v,i)=>v === "o" ? "アイウエ"[i] : "").join("").split("").join("・") || "なし";
    }
    return item.answer;
  }

  function formatStamp(value) {
    if (!value || isNaN(Date.parse(value))) return "記録なし";
    const d = new Date(value), pad = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function derive() {
    const circles = [];
    const crosses = [];
    state.marks.forEach((v,i)=>{ if(v==="o") circles.push(i+1); if(v==="x") crosses.push(i+1); });

    if (state.currentMode === "correct") {
      return circles.length === 1
        ? {valid:true,value:circles[0],text:"回答："+["","①","②","③","④"][circles[0]]}
        : {valid:false,text:"○を1つにすると回答が確定します"};
    }
    if (state.currentMode === "wrong") {
      return crosses.length === 1
        ? {valid:true,value:crosses[0],text:"回答："+["","①","②","③","④"][crosses[0]]}
        : {valid:false,text:"×を1つにすると回答が確定します"};
    }
    const judged = state.marks.filter(Boolean).length;
    const combination = circles.map(n=>"アイウエ"[n-1]).join("・") || "なし";
    return judged === 4
      ? {valid:true,value:combination,text:"回答："+combination}
      : {valid:false,text:"4つすべて○×を付けると回答が確定します"};
  }

  function renderMarks() {
    document.querySelectorAll(".mark-btn").forEach(btn=>{
      const i = Number(btn.dataset.i);
      const v = state.marks[i];
      btn.classList.remove("o","x");
      btn.querySelector(".n").textContent = state.currentMode === "count" ? "アイウエ"[i] : ["①","②","③","④"][i];
      btn.querySelector(".m").textContent = "－";
      if (v === "o") { btn.classList.add("o"); btn.querySelector(".m").textContent = "○"; }
      if (v === "x") { btn.classList.add("x"); btn.querySelector(".m").textContent = "×"; }
    });
    const d = derive();
    $("derived").textContent = d.text;
    $("derived").style.borderColor = d.valid ? "var(--accent)" : "var(--border)";
  }

  function renderModes() {
    document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active", b.dataset.mode===state.currentMode));
    $("modeHint").textContent = modes[state.currentMode];
  }

  function formatDateJP(value) {
    if (!value) return "未設定";
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    return m ? `${Number(m[1])}/${Number(m[2])}/${Number(m[3])}` : value;
  }

  function buildChatGPTText() {
    const keys = answerKeys().filter(n => Object.prototype.hasOwnProperty.call(state.grades, n));
    if (!keys.length) return "";

    const correct = keys.filter(n=>state.grades[n]===true);
    const wrong = keys.filter(n=>state.grades[n]===false);
    const rate = Math.round(correct.length / keys.length * 100);
    const stats = {};

    keys.forEach(n=>{
      const f = (state.answers[n] && state.answers[n].field) || "未設定";
      if (!stats[f]) stats[f] = {correct:0,total:0};
      stats[f].total++;
      if (state.grades[n]===true) stats[f].correct++;
    });

    const first = state.answers[answerKeys()[0]];
    const sessionDate = first && first.startedAt ? currentDateTimeParts(new Date(first.startedAt)).date : (state.legacySessionDate || currentDateTimeParts().date);
    const lines = [
      `日付：${formatDateJP(sessionDate)}`,
      "",
      state.sessionType === "workbook"
        ? "宅建の問題集を解きました。苦手分野を分析してください。"
        : "宅建の過去問・模試を解きました。苦手分野を分析してください。",
      "",
      `学習形式：${state.sessionType === "workbook" ? "問題集" : "過去問・模試"}`,
      `全体：${keys.length}問中 ${correct.length}問正解 / 正答率${rate}%`,
      `間違い：${wrong.length ? wrong.map(n=>paperNumber(n)).join("、") + "問" : "なし"}`,
      "",
      "【分野別】"
    ];

    Object.entries(stats).forEach(([field,s])=>{
      lines.push(`${field}：${s.correct}/${s.total}（${Math.round(s.correct/s.total*100)}%）`);
    });

    if (wrong.length) {
      lines.push("", "【間違えた問題の回答】");
      wrong.forEach(n=>{
        const item = state.answers[n];
        if (!item) return;
        const marks = item.marks.map(v=>v==="o"?"○":v==="x"?"×":"－").join("");
        lines.push(`${paperNumber(n)}問目｜${item.field || "未設定"}｜各肢:${marks}｜回答:${answerValue(item)}`);
      });
    }

    lines.push("", "【各問題の時間ログ】");
    answerKeys().forEach(n=>{
      const item = state.answers[n];
      lines.push(`${paperNumber(n)}問目｜${item.field || "未設定"}｜開始:${formatStamp(item.startedAt)}｜確定:${formatStamp(item.endedAt)}`);
    });

    lines.push(
      "",
      "この結果から、①苦手分野 ②間違い方の傾向 ③復習の優先順位 ④次にやる勉強を3つ、分かりやすく教えてください。"
    );

    return lines.join("\n");
  }

  function updateSharePreview() {
    const text = buildChatGPTText();
    $("sharePreview").textContent = text || "採点すると、ここに送信用の文章が表示されます。";
    $("copyResult").disabled = !text;
  }

  function renderScore() {
    const keys = answerKeys().filter(n => Object.prototype.hasOwnProperty.call(state.grades, n));
    if (!keys.length) {
      $("overall").textContent = "まだ採点されていません";
      $("wrong").textContent = state.sessionType === "workbook" ? "各問題を解くたびに正否を入力すると、ここに集計されます。" : "回答一覧で各問題を○・×で採点してください。";
      $("fieldScores").innerHTML = "";
      updateSharePreview();
      return;
    }

    const correct = keys.filter(n=>state.grades[n]===true);
    const wrong = keys.filter(n=>state.grades[n]===false);
    const rate = Math.round(correct.length / keys.length * 100);
    $("overall").textContent = `${keys.length}問中 ${correct.length}問正解 / 正答率${rate}%`;
    $("wrong").textContent = wrong.length ? `間違い：${wrong.map(n=>paperNumber(n)).join("、")}問` : "間違い：なし 🎉";

    const stats = {};
    keys.forEach(n=>{
      const f = state.answers[n].field || "未設定";
      if (!stats[f]) stats[f] = {correct:0,total:0};
      stats[f].total++;
      if (state.grades[n]===true) stats[f].correct++;
    });

    $("fieldScores").innerHTML = "";
    Object.entries(stats).forEach(([field,s])=>{
      const row = document.createElement("div");
      row.className = "field-row";
      const l = document.createElement("div");
      l.style.fontWeight = "700";
      l.textContent = field;
      const r = document.createElement("div");
      r.style.fontWeight = "800";
      r.textContent = `${s.correct}/${s.total}　${Math.round(s.correct/s.total*100)}%`;
      row.append(l,r);
      $("fieldScores").appendChild(row);
    });
    updateSharePreview();
  }

  function renderAnswers() {
    $("answerList").innerHTML = "";
    const keys = answerKeys();
    $("empty").classList.toggle("hidden", keys.length>0);

    let lastField = null, group = null, grid = null;
    keys.forEach(n=>{
      const item = state.answers[n];
      if (item.field !== lastField) {
        group = document.createElement("div");
        group.className = "field-group";
        const h = document.createElement("div");
        h.className = "field-name";
        h.textContent = item.field || "未設定";
        group.appendChild(h);
        grid = document.createElement("div");
        grid.className = state.scoreMode ? "answer-grid score" : "answer-grid";
        group.appendChild(grid);
        $("answerList").appendChild(group);
        lastField = item.field;
      }

      const marks = item.marks.map(v=>v==="o"?"○":v==="x"?"×":"－").join("");
      const value = answerValue(item);

      if (!state.scoreMode) {
        const b = document.createElement("button");
        const grade = state.grades[n];
        b.className = "answer-mini" + (grade===true ? " correct" : grade===false ? " incorrect" : "");
        b.type = "button";
        const gradeMark = grade===true ? " ○" : grade===false ? " ×" : "";
        b.innerHTML = `<div class="small">${paperNumber(n)}問目${gradeMark}</div><div class="marks">${marks}</div><div class="val">${value}</div>`;
        b.addEventListener("click",()=>loadQuestion(n));
        grid.appendChild(b);
      } else {
        const card = document.createElement("div");
        card.className = "score-card";
        const top = document.createElement("button");
        top.type = "button";
        top.className = "score-top";
        top.innerHTML = `<div class="small">${paperNumber(n)}問目</div><div style="font-size:14px;font-weight:700;margin-top:3px">${marks} → ${value}</div>`;
        top.addEventListener("click",()=>loadQuestion(n));
        card.appendChild(top);

        const gg = document.createElement("div");
        gg.className = "grade-grid";

        const ok = document.createElement("button");
        ok.className = "grade ok" + (state.grades[n]===true ? " active":"");
        ok.type = "button"; ok.textContent = "○ 正解";
        ok.addEventListener("click",()=>{state.grades[n]=true; save(); renderAnswers(); renderScore();});

        const ng = document.createElement("button");
        ng.className = "grade ng" + (state.grades[n]===false ? " active":"");
        ng.type = "button"; ng.textContent = "× 不正解";
        ng.addEventListener("click",()=>{state.grades[n]=false; save(); renderAnswers(); renderScore();});

        gg.append(ok,ng); card.appendChild(gg); grid.appendChild(card);
      }
    });
  }

  function render() {
    $("qNum").textContent = state.currentPaperNumber;
    $("answeredCount").textContent = answerKeys().length;
    $("fieldLabel").textContent = state.currentField;
    document.querySelectorAll(".session-mode").forEach(b=>b.classList.toggle("active", b.dataset.session===state.sessionType));
    $("sessionModeHint").textContent = sessionHints[state.sessionType];
    $("examConfirmWrap").classList.toggle("hidden", state.sessionType !== "exam");
    $("workbookGradeWrap").classList.toggle("hidden", state.sessionType !== "workbook");
    $("scoreToggle").textContent = state.scoreMode ? (state.sessionType === "workbook" ? "問題入力に戻る" : "回答モードに戻る") : (state.sessionType === "workbook" ? "成績・正否を確認" : "採点モードにする");
    $("scoreToggle").classList.toggle("primary", state.scoreMode);
    $("scorePanel").classList.toggle("hidden", !state.scoreMode);
    $("listHint").textContent = state.scoreMode
      ? (state.sessionType === "workbook" ? "○正解 / ×不正解をタップすると後から修正できます" : "問題集の解答を見ながら、○正解 / ×不正解をタップ")
      : (state.sessionType === "workbook" ? "緑＝正解、赤＝不正解。タップするとその問題に戻れます" : "タップするとその問題に戻れます");
    renderModes(); renderMarks(); renderAnswers();
    if (state.scoreMode) renderScore();
  }

  function loadQuestion(n) {
    const previous = state.current;
    const previousPaper = state.currentPaperNumber;
    if (!state.answers[previous] && state.currentStartedAt) state.starts[previous] = state.currentStartedAt;
    state.current = Math.max(1,n);
    const item = state.answers[state.current];
    if (item) {
      state.currentMode = item.mode;
      state.currentField = item.field;
      state.currentPaperNumber = paperNumber(state.current);
      state.currentStartedAt = item.startedAt || null;
      state.marks = [...item.marks];
    } else {
      state.currentPaperNumber = Math.max(1, previousPaper + state.current - previous);
      state.currentStartedAt = state.starts[state.current] || new Date().toISOString();
      state.starts[state.current] = state.currentStartedAt;
      state.marks = [null,null,null,null];
    }
    save(); render();
  }

  function clearSessionDataForMode(newType) {
    state.sessionType = newType;
    state.current = 1;
    state.currentPaperNumber = 1;
    state.currentStartedAt = new Date().toISOString();
    state.starts = {};
    state.marks = [null,null,null,null];
    state.scoreMode = false;
    state.answers = {};
    state.grades = {};
    state.legacySessionDate = null;
  }

  document.querySelectorAll(".session-mode").forEach(btn=>btn.addEventListener("click",()=>{
    const newType = btn.dataset.session;
    if (newType === state.sessionType) return;
    const hasData = answerKeys().length > 0 || Object.keys(state.grades).length > 0;
    if (hasData) {
      const label = newType === "workbook" ? "問題集" : "過去問・模試";
      if (!confirm(`${label}モードに切り替えると、現在の回答・採点結果をリセットします。切り替えますか？`)) return;
      clearSessionDataForMode(newType);
    } else {
      clearSessionDataForMode(newType);
    }
    save(); render();
  }));

  function saveCurrentWithGrade(isCorrect) {
    const d = derive();
    if (!d.valid) { $("derived").textContent = d.text; return; }
    const n = state.current;
    const endedAt = new Date().toISOString();
    recordAnswer(d.value, endedAt);
    state.grades[n] = isCorrect;
    state.current++;
    state.currentPaperNumber++;
    state.currentStartedAt = endedAt;
    state.starts[state.current] = endedAt;
    state.marks = [null,null,null,null];
    save(); render();
  }

  function recordAnswer(value, endedAt) {
    const previous = state.answers[state.current];
    state.answers[state.current] = {
      field: state.currentField,
      paperNumber: state.currentPaperNumber,
      mode: state.currentMode,
      marks: [...state.marks],
      answer: value,
      startedAt: previous && previous.startedAt || state.starts[state.current] || state.currentStartedAt || endedAt,
      endedAt
    };
  }

  $("workbookCorrect").addEventListener("click",()=>saveCurrentWithGrade(true));
  $("workbookWrong").addEventListener("click",()=>saveCurrentWithGrade(false));

  $("setField").addEventListener("click",()=>{
    const v = $("fieldInput").value.trim();
    if (v) {
      const ascii = v.replace(/[０-９]/g, digit=>String.fromCharCode(digit.charCodeAt(0)-65248));
      const match = /^(.+?)[\s　]*(\d+)[\s　]*(?:問目|問)?$/.exec(ascii);
      if (match && match[1].trim() && Number(match[2]) > 0) {
        state.currentField = match[1].trim();
        state.currentPaperNumber = Number(match[2]);
      } else {
        state.currentField = v;
      }
    }
    $("fieldInput").value = "";
    save(); render();
  });

  $("fieldInput").addEventListener("keydown",e=>{
    if (e.key==="Enter") { e.preventDefault(); $("setField").click(); }
  });

  document.querySelectorAll(".mode").forEach(btn=>btn.addEventListener("click",()=>{
    state.currentMode = btn.dataset.mode; save(); render();
  }));

  document.querySelectorAll(".mark-btn").forEach(btn=>btn.addEventListener("click",()=>{
    const i = Number(btn.dataset.i);
    state.marks[i] = state.marks[i]===null ? "o" : state.marks[i]==="o" ? "x" : null;
    save(); renderMarks();
  }));

  $("confirm").addEventListener("click",()=>{
    if (state.sessionType !== "exam") return;
    const d = derive();
    if (!d.valid) { $("derived").textContent = d.text; return; }
    const endedAt = new Date().toISOString();
    recordAnswer(d.value, endedAt);
    state.current++;
    state.currentPaperNumber++;
    state.currentStartedAt = endedAt;
    state.starts[state.current] = endedAt;
    state.marks = [null,null,null,null];
    save(); render();
  });

  $("prev").addEventListener("click",()=>loadQuestion(state.current-1));
  $("next").addEventListener("click",()=>loadQuestion(state.current+1));

  $("scoreToggle").addEventListener("click",()=>{
    state.scoreMode = !state.scoreMode; save(); render();
  });

  $("copyResult").addEventListener("click", async ()=>{
    const text = buildChatGPTText();
    if (!text) return;
    let copied = false;
    try {
      await navigator.clipboard.writeText(text);
      copied = true;
    } catch(e) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { copied = document.execCommand("copy"); } catch(_) {}
      ta.remove();
    }
    $("copyStatus").textContent = copied ? "コピーしました ✓　そのままChatGPTに貼り付けてOKです" : "コピーできませんでした。文章を長押ししてコピーしてください。";
    if (copied) setTimeout(()=>{ $("copyStatus").textContent = ""; }, 2500);
  });

  $("reset").addEventListener("click",()=>{
    if (!confirm("回答と採点結果をすべてリセットしますか？")) return;
    state = {
      sessionType:state.sessionType,
      current:1,currentPaperNumber:1,currentStartedAt:new Date().toISOString(),starts:{},currentMode:"correct",currentField:state.currentField,
      marks:[null,null,null,null],scoreMode:false,answers:{},grades:{}
    };
    save(); render();
  });

  load();
  render();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
